<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Navy Health Policy Compare{% endblock %}</title>
<style>
  /* Navy Health's brand, as on the call screen (static/app.css): navy, ink, yellow, cream; Kanit and
     Poppins, self-hosted. */
  @font-face { font-family:"Kanit"; font-weight:800; font-display:swap; src:url("{{ url_for('static', filename='fonts/kanit-800.woff2') }}") format("woff2"); }
  @font-face { font-family:"Poppins"; font-weight:400; font-display:swap; src:url("{{ url_for('static', filename='fonts/poppins-400.woff2') }}") format("woff2"); }
  @font-face { font-family:"Poppins"; font-weight:600; font-display:swap; src:url("{{ url_for('static', filename='fonts/poppins-600.woff2') }}") format("woff2"); }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    background:#fff8db; color:#262d41; margin:0; min-height:100vh;
    font-family:"Poppins",-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px 16px;
    border-top:6px solid #fcc300;
  }
  .card {
    background:#ffffff; border:1px solid #e3e0e1; border-radius:12px 12px 40px 12px;
    padding:32px 36px; width:100%; max-width:420px; box-shadow:0 6px 24px rgba(30,43,95,0.10);
  }
  .brand { display:flex; flex-direction:column; align-items:center; gap:10px; margin-bottom:24px; }
  .brand img { height:46px; width:auto; }
  .brand span { font-family:"Kanit","Poppins",sans-serif; font-weight:800; text-transform:uppercase; letter-spacing:0.04em;
                color:#1e2b5f; font-size:0.95rem; padding-top:8px; border-top:3px solid #fcc300; }
  h1 { font-family:"Kanit","Poppins",sans-serif; font-size:1.3rem; font-weight:800; text-transform:uppercase;
       color:#1e2b5f; margin:0 0 6px; text-align:center; }
  .sub { color:#626879; font-size:0.85rem; text-align:center; margin:0 0 22px; line-height:1.5; }
  label { display:block; font-size:0.75rem; color:#626879; text-transform:uppercase; font-weight:600;
          letter-spacing:0.05em; margin:14px 0 5px; }
  input[type=email], input[type=password], input[type=text], input[type=tel] {
    width:100%; padding:10px 12px; border-radius:6px; border:1px solid #cfcacc;
    background:#ffffff; color:#262d41; font-size:0.95rem; font-family:inherit;
  }
  input:focus { outline:none; border-color:#fcc300; box-shadow:0 0 0 4px rgba(252,195,0,0.25); }
  button {
    margin-top:20px; width:100%; padding:12px; border-radius:4px; border:none; font-family:inherit;
    background:#1e2b5f; color:#fff; font-weight:600; font-size:0.95rem; cursor:pointer;
  }
  button:hover { opacity:0.9; }
  button.ghost { background:transparent; color:#1e2b5f; border:2px solid #fcc300; border-radius:9px; }
  .err  { background:rgba(255,106,91,0.12); border:1px solid #ff6a5b; color:#c23b2c;
          padding:9px 12px; border-radius:6px; font-size:0.83rem; margin-top:14px; }
  .note { background:rgba(187,214,227,0.45); border:1px solid #80aabe;
          color:#1e2b5f; padding:9px 12px; border-radius:6px; font-size:0.83rem; margin-top:14px; }
  .links { margin-top:20px; text-align:center; font-size:0.83rem; color:#626879; line-height:1.9; }
  .links a { color:#1e2b5f; font-weight:600; text-decoration:none; }
  .links a:hover { text-decoration:underline; text-decoration-color:#fcc300; text-decoration-thickness:2px; }
  .hint { color:#626879; font-size:0.75rem; margin-top:5px; }
  .body-text { color:#3f4558; font-size:0.9rem; line-height:1.6; text-align:center; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <img src="{{ url_for('static', filename='navy-health-logo.webp') }}" alt="Navy Health">
      <span>Policy Compare</span>
    </div>
    {% block content %}{% endblock %}
  </div>
</body>
</html>
