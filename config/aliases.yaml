# The words reps and members use for each fund, beyond its published name, code and brands.
#
# The call screen's type-ahead and request reader match these as well as the government data, so
# "defence" finds Defence Health and "qantas" finds nib's Qantas Insurance range. Navy Health's sales
# team may add to this list; the app reads it when it starts. Keys are the government fund codes.

ACA: [aca]
AHB: [defence, defence health, dhl]
AHM: [ahm]
AMA: [doctors, doctors health]
AUF: [australian unity, unity]
BUP: [bupa]
CBC: [cbhs corporate]
CBH: [cbhs, commonwealth bank health]
CDH: [hunter, hunter health, cdh, hhi]
CPS: [see-u, seeu, see u]
FAI: [gu, gu health]
GMH: [gmhba, frank]
HBF: [hbf]
HCF: [hcf]
HCI: [hci]
HIF: [hif]
LHM: [peoplecare]
LHS: [latrobe, federation]
MBP: [medibank]
MDH: [mildura]
MYO: [aia, myown]
NIB: [nib, qantas, aami, suncorp, apia, ing, priceline, real health, seniors health]
NTF: [teachers, teachers health, unihealth, nurses, nurses and midwives]
OMF: [onemedifund, one medifund]
PWA: [phoenix]
QCH: [queensland country, qcountry, territory health]
