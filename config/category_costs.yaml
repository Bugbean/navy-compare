# What a hospital clinical category is worth to a member, used by engine/claims.hospital_sheet and the
# talking point. The government policy data says only covered / restricted / not covered for each of
# the 38 categories; it has no dollar figure or wait per category. These come from outside it:
#
#   private_cost      what the category's most common procedure typically costs as a private patient.
#                     Mostly the Australian Government's Medical Costs Finder (2023-24 national
#                     figures: typical specialist fee + typical hospital fee, anaesthetist excluded, so
#                     real totals run a little higher). Where the figure is something else - per session,
#                     per day, hospital charges only, an insurer payout - `cost_words` says so, and the
#                     screen shows those words beside it.
#   public_wait_days  AIHW MyHospitals 2024-25 national median wait for that procedure as a public
#                     elective surgery patient. Null where it isn't elective surgery.
#   null              no reliable published figure was found; nothing is shown in its place.
#
# Researched October 2026. Weaker figures say so in their source (ESTIMATE, PROXY, research median,
# hospital charges only). Please have Navy Health confirm before relying on them.

