# Typical fee per extras item (AUD), used by engine/estimate.py ONLY where a policy pays a percentage
# of the fee ("70% back") instead of a fixed dollar benefit, and to cap a fixed benefit at what a
# visit realistically costs. Every estimate shows these as assumptions and the rep can change each one.
#
# Researched October 2026. Confidence varies — please have Navy Health confirm before relying on them:
#   strongest  dental 012/114/121/417/615/881 (ADA 2022 survey via CHOICE; WorkSafe Vic 1 Jul 2026
#              schedule), orthotics, physio, podiatry, osteopathy
#   moderate   consumer price ranges or single clinics: chiro, acupuncture, Chinese herbal, massage,
#              exercise physiology, speech, antenatal, home nursing, hearing aid, psychology, vaccinations
#   weak       dietetics, orthoptics, multifocal lenses, extraction (322)
#   estimate   no source found ("ESTIMATE" in source): audiology follow-up, glucose monitor, health
#              management, non-PBS script, OT follow-up, single-vision lenses
# Government schedules (DVA, TAC, Bupa ADF) usually sit below private fees, so items leaning on them
# may understate what a member actually pays.

